name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # VITE_API_BASE_URL is intentionally left unset until the AWS backend
      # is deployed, so production Pages builds still serve placeholder data.
      #
      # BASE_PATH: this repo is served as a GitHub Pages *project* page
      # (lj-web-management.github.io/admin.ljwebmanagement.com/) until DNS
      # cutover to the custom domain. Set the repo variable CUSTOM_DOMAIN_LIVE
      # to any value once admin.ljwebmanagement.com resolves, which switches
      # the build to root-relative asset paths and re-adds the CNAME file.
      - name: Build
        env:
          VITE_ENV: ${{ vars.VITE_API_BASE_URL && 'production' || 'mock' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          BASE_PATH: ${{ vars.CUSTOM_DOMAIN_LIVE && '/' || '/admin.ljwebmanagement.com/' }}
        run: npm run build

      - name: Add custom domain CNAME
        if: vars.CUSTOM_DOMAIN_LIVE
        run: echo "admin.ljwebmanagement.com" > dist/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
